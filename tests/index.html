<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FluxaWay - Engine Tests</title>
    <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg" />
    <link rel="stylesheet" href="/dist/fluxaway-ui.css" />
    <!-- charts.test.js asserts on RESOLVED colours (the PNG export reads them
         back through getComputedStyle), so the add-on's palette tokens have to
         be loaded here just as an app would load them. -->
    <link rel="stylesheet" href="/dist/fluxaway-charts.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <h1>FluxaWay engine tests</h1>
      <p class="t-hint">
        No build step, no test framework — this page imports
        <code>dist/fluxaway.js</code> directly and runs assertions against the
        real DOM. Open the console for stack traces on failures.
      </p>
      <div id="results">Running…</div>
    </main>
    <script type="module" src="./run.js"></script>
  </body>
</html>
